name: Atlas Cloud Quality Checks
on:
  push:
    branches: [main, atlas-studio-screens-121, atlas-studio-polish-122, atlas-intent-124, atlas-stop-125]
    paths:
      - "index.html"
      - "atlas-app-v8.js"
      - "atlas-motion.mjs"
      - "atlas-history.mjs"
      - "atlas-presentation.mjs"
      - "atlas-studio-controls.mjs"
      - "cloudflare-worker/**"
      - "atlas-hosted-worker.js"
      - "atlas-cloud-bridge.py"
      - "install-atlas-cloud.sh"
      - "tests/**"
      - ".github/workflows/atlas-cloud-checks.yml"
  workflow_dispatch:
concurrency:
  group: atlas-cloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax-and-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python availability
        run: python3 --version
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript
        run: node --check atlas-app-v8.js
      - name: Check 3D scene syntax
        run: |
          node --input-type=module -e "import fs from 'node:fs';import vm from 'node:vm';const h=fs.readFileSync('index.html','utf8');const s=h.match(/<script type=\"module\">([\\s\\S]*?)<\\/script>/)[1].replace(/^import .*$/gm,'');new vm.Script(s);"
      - name: Check that Atlas loads its cloud frontend
        run: |
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); if (!h.includes('atlas-app-v8.js')) process.exit(1); if (h.includes('askAtlasLocalAI')) process.exit(1)"
      - name: Check hosted Worker JavaScript syntax and permissions
        run: |
          node --check cloudflare-worker/index.js
          node --test tests/*.test.mjs
      - name: Check backend Python syntax
        run: python3 -m py_compile atlas-cloud-bridge.py
      - name: Check installer shell syntax
        run: bash -n install-atlas-cloud.sh
      - name: Backend unit tests (no secrets or API calls)
        run: python3 -m unittest discover -s tests -p "test_atlas_cloud.py" -v

